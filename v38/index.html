/* ---------- 部署別ビュー（規則で生成） ---------- */
function openDept(d){curDept=d;cur="portal";drawAll();window.scrollTo(0,0);}
function deptBody(){
 const D=curDept; const rows=[];
 ALL.forEach(l=>{ if(!l.owner) return;
  const f=FOL[l.k];
  if(l.owner===D){ rows.push([l.n,"主管ライブラリ（全体）","主管",""]); return; }
  if(!f) return;
  const seen=new Set();
  f.after.forEach(r=>{const t=r[0].split(" ＞ ")[0];
   if(t===D&&!seen.has("d")){seen.add("d");rows.push([l.n,`${D} ＞ …`,"第1階層",`主管：${l.owner}`]);}
   if(t==="共有"&&!seen.has("s")&&(users(l.k).includes(D)||(l.users||[]).includes(D))){seen.add("s");rows.push([l.n,"共有 ＞ …","共有","利用部署として"]);}
  });
 });
 const head=`<div class="card"><h2><span class="badge b2">A</span>${D}｜自部署のフォルダの格納先（規則から生成）</h2>`;
 if(!rows.length) return head+`<div class="body"><div class="note">この部署の抜粋データは、このデモには含めていません。規則は同じです：自部署が主管のライブラリ＋他ライブラリの「${D}」第1階層＋利用部署に入っている共有フォルダ。</div>
  <div style="margin-top:14px"><span class="dbtn" style="display:inline-flex" onclick="curDept=null;drawAll()">← ポータルに戻る</span></div></div></div>`;
 return head+`<div class="tool"><span>${rows.length} 件（抜粋ライブラリ内）</span><span style="margin-left:auto;cursor:pointer;color:#0f6cbd" onclick="curDept=null;drawAll()">← ポータルに戻る</span></div>
  <table class="tb"><thead><tr><th style="width:38%">ライブラリ</th><th style="width:26%">入口</th><th style="width:12%">根拠</th><th>備考</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="fo">${esc(r[0])}</td><td>${esc(r[1])}</td><td><span class="lv">${r[2]}</span></td><td style="color:#8a8886">${esc(r[3])}</td></tr>`).join("")}
  </tbody></table>
  <div class="body"><div class="note g">この表は <b>LIBS の owner と、各ライブラリの第1階層名だけ</b>から生成しています。フォルダを増やしても、規則を守っていればこの表は自動で追随します。</div></div></div>`;
}

/* ---------- ライブラリ ---------- */
function libBody(){
 if(cur==="PJ")return pjBody(); if(cur==="IN")return inBody(); if(cur==="OWN")return ownBody();
 if(cur==="ARC")return`<div class="card"><h2>アーカイブ（部署別）</h2><div class="body"><div style="font-size:12.5px;color:#605e5c">保存義務のみ・読み取り専用。1年以上アクセスのないファイルをここへ移します。</div></div></div>`;
 const lib=(LIBS[cur]||[]).find(l=>l.k===curLib)||(LIBS[cur]||[])[0]; const f=FOL[lib.k];
 if(!f)return`<div class="card"><h2>${lib.n}</h2><div class="body">このライブラリはデモに含めていません。</div></div>`;
 const rows=f[mode]; const nb=f.before.length,na=f.after.length;
 const cnt=c=>f.before.filter(r=>r[1]===c).length;
 const us=users(lib.k).filter(u=>u!==lib.owner);
 return`<div class="card">
  <h2><span class="badge b1">①</span>${lib.n}<span class="lv">${lib.lv}</span>
   <span style="font-size:11.5px;color:#605e5c;font-weight:400">主管：<span class="own">${lib.owner}</span>　公開範囲：${mode==="before"?`<span class="warn">${lib.sg}</span>`:`${lib.owner}${us.length?" ＋ "+us.join("・"):""}`}</span>
   <span class="tg"><div class="${mode==='before'?'on':''}" onclick="setMode('before')">v3.5（現行）${nb}</div><div class="${mode==='after'?'on':''}" onclick="setMode('after')">v3.8（今回案）${na}</div></span></h2>
  <div class="tool"><span class="nw">＋ 新規</span><span>↑ アップロード</span><span style="margin-left:auto;color:#605e5c">
   ${mode==='before'?`<span style="color:#a4262c">重複 ${cnt("dup")}・削除 ${cnt("del")}・移動 ${cnt("out")}・PJへ ${cnt("mv")}・凍結 ${cnt("frz")}・要協議 ${cnt("ask")}</span>`:`<span style="color:#107c10">整理後 ${na} 件</span>`}</span></div>
  <table class="tb"><thead><tr><th style="width:70%">名前</th><th>更新日時</th><th>更新者</th></tr></thead><tbody>
  ${rows.map(r=>{const c=r[1];const strike=["dup","del","mv","out"].includes(c);const isList=r[3]===true;
   return`<tr><td class="${isList?"ls":"fo"} ${strike?"del":""}">${esc(r[0])}${tag(c,r[2])}</td><td style="color:#8a8886">2026/07/13</td><td style="color:#8a8886">構成案より</td></tr>`;}).join("")}
  </tbody></table>
  <div class="body"><div class="note">${f.msg}</div>${(f.q||[]).map(q=>`<div class="quote">${esc(q[0])}<br><small>― ${esc(q[1])}</small></div>`).join("")}</div></div>`;
}

/* ---------- PJサイト ---------- */
function pjBody(){const lib=LIBS.PJ.find(l=>l.k===curLib)||LIBS.PJ[0];
 return`<div class="card"><h2><span class="badge b3">③</span>${lib.n}<span class="lv">L3</span>${lib.ex?'<span class="t t-ext">既存</span>':'<span class="t t-add">新設</span>'}
  <span style="margin-left:auto;font-size:11.5px;color:#605e5c;font-weight:400">権限：このPJの関係者のみ（PJ単位）</span></h2>
  <div class="tool"><span class="nw">＋ 新規</span><span>↑ アップロード</span><span style="margin-left:auto;color:#605e5c">全PJ共通テンプレート ${PJTMPL.length} フォルダ</span></div>
  <table class="tb"><thead><tr><th style="width:70%">名前</th><th>更新日時</th><th>更新者</th></tr></thead><tbody>
  ${PJTMPL.map(n=>`<tr><td class="fo">${esc(n)}</td><td style="color:#8a8886">—</td><td style="color:#8a8886">テンプレート</td></tr>`).join("")}</tbody></table>
  <div class="body">
   <div class="quote">技術部としてはプロジェクトごとにあらたにサイトを立ち上げてデータ運用をするサイト群と、各プロジェクトサイトからフィードバックを送るナレッジサイト群の2部構成の運用をしないと工事案件が増えた時に管理がオーバーフローする<br><small>― 生産技術室 別紙「サイト」</small></div>
   <div class="note o"><b>PJ期間中はここで作業し、終了時にナレッジ層へ移します。</b>移すのは「後で参照するもの」だけです。完了報告書・フィードバックは F14-01「完了PJ」、契約書は F03-02、完成図書は F13-01、設備仕様は F14-02 へ。残りは「過去PJ」としてアーカイブします。</div>
   <div class="note g">テンプレートは、各業務ライブラリに散らばっていた「プロジェクト(共通) ＞ PJ」配下を1か所に集めたものです。F01-01・F05-04・F12-01・F14-01・F14-02・F14-11 ほか 9 ライブラリに同じPJ用フォルダが分散していました。</div>
   <div class="note b">既存の 札幌PJ・京都PJ・高級リネン打ち合わせ・365勉強会チーム は現状維持とし、移行対象から除外して台帳に記録します（生産部 No.64）。</div>
  </div></div>`;}

/* ---------- 入力層サイト ---------- */
function inBody(){const lib=LIBS.IN.find(l=>l.k===curLib)||LIBS.IN[0];
 const kind=lib.k.startsWith("IN0")&&["IN01","IN02"].includes(lib.k)?"商流別横軸（No.61）":lib.k==="IN03"?"生産管理（No.62）":"拠点サイト（No.63）";
 const who=lib.k==="IN03"?"生産管理室＋生産課長":["IN01","IN02"].includes(lib.k)?"該当所属課":"当該生産課";
 return`<div class="card"><h2><span class="badge b6">⑥</span>${lib.n}<span class="lv">L3</span><span class="t t-ext">試験運用</span>
  <span style="margin-left:auto;font-size:11.5px;color:#605e5c;font-weight:400">${kind}　権限：${who}</span></h2>
  <div class="tool"><span class="nw">＋ 新規</span><span>↑ アップロード</span><span style="margin-left:auto;color:#605e5c">Teams のチャネル構成と一致させる</span></div>
  <table class="tb"><thead><tr><th style="width:70%">名前</th><th>更新日時</th><th>更新者</th></tr></thead><tbody>
  ${INTMPL.map(n=>`<tr><td class="fo">${esc(n)}</td><td style="color:#8a8886">—</td><td style="color:#8a8886">テンプレート</td></tr>`).join("")}</tbody></table>
  <div class="body">
   <div class="quote">各サイトに「会議・議事録系」「進捗確認データ」「ナレッジ承認」を設置し、承認済みデータを権限者が定期的にナレッジフォルダへ移す運用にしたい<br><small>― 生産部 No.61</small></div>
   <div class="note p"><b>19サイト（ナレッジ層）の外に置く、期間限定の入力層です。</b>日々の入力・作業データはここで扱い、承認済みのものだけをナレッジ層の該当ライブラリ（F05-01 会議、F05-05 実績など）へ移します。生産管理サイトの経費確定データは、F05-05 経費日報へ自動転送（Power Automate）を想定します（No.62）。</div>
   <div class="note">拠点サイトは福岡生産課・木場生産課・大阪第3生産課の3拠点でデモ運用し、Teams＋Power Platform の標準テンプレートを確立してから他拠点へ展開します（No.63）。テンプレート無しで各拠点が個別に作ると構成がばらけるためです。</div>
   <div class="note o">試験運用の評価軸：入力工数が下がるか／承認フローが回るか／ナレッジ層に重複が出ないか。1〜3か月で判断し、効果があれば全社の2層構成の標準にします（No.59）。</div>
  </div></div>`;}

/* ---------- 主管部署一覧 ---------- */
function ownBody(){
 const rows=ALL.filter(l=>l.owner&&l.k!=="l2");
 return`<div class="card"><h2><span class="badge b2">②</span>主管部署一覧（抜粋 ${rows.length} 本／全115本）</h2>
  <div class="tool"><span>確認会で埋める表です。決めるのは<b>主管部署</b>だけ。利用部署は第1階層の名前から自動で出ます</span></div>
  <table class="tb"><thead><tr><th>ライブラリ</th><th>主管部署（案）</th><th>利用部署（第1階層から）</th><th>現行の公開範囲</th><th>v3.8 の公開範囲</th><th>確認</th></tr></thead><tbody>
  ${rows.map(l=>{const us=(l.users||users(l.k)).filter(u=>u!==l.owner);const bad=l.sg!==l.owner||us.some(u=>u!==l.sg);
   return`<tr><td class="fo">${esc(l.n)}${l.was?`<br><small style="color:#8a8886">旧：${esc(l.was)}</small>`:""}</td><td class="own">${l.owner}</td><td>${us.join("・")||"—"}</td>
   <td>${bad?`<span class="warn">${l.sg}</span>`:l.sg}</td><td>${l.owner}${us.length?" ＋ "+us.join("・"):""}</td><td><span class="chk"></span></td></tr>`;}).join("")}
  </tbody></table>
  <div class="body">
   ${EXTRA_LIBS.map(l=>`<div class="note r"><b>${esc(l.n)}：</b>${esc(l.fix)}</div>`).join("")}
   <div class="note b">赤字＝現行の公開範囲が主管または利用部署と一致していないもの。設計データ上、115本のうち48本がこの状態でした。②の規則（公開範囲＝主管＋利用部署）で機械的に解消します。</div>
   <div class="note">この表はデモ用に、設計書v3.5から起こしたデータで作っています。設計書の公開範囲シートとの再照合が必要です。F14-13 の現行公開範囲「生産部」は設計データの誤りの可能性があります。</div>
  </div></div>`;
}

function drawAll(){drawHub();drawSide();drawHead();el("pad").innerHTML=curDept?deptBody():(cur==="portal"?portalBody():libBody());}
function go(id){cur=id;curDept=null;curLib=(LIBS[id]||[{k:""}])[0].k;drawAll();window.scrollTo(0,0);}
function selLib(k){curLib=k;curDept=null;drawAll();}
function setMode(m){mode=m;drawAll();}
drawAll();
</script>
</body>
</html>
