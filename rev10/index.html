<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>サイト設計デモ v4.0 ― 共通文書管理体系 rev10（小分類マスタ）反映</title>
<style>
:root{
  --navy:#0b3d91; --ink:#1f1f1f; --gray:#605e5c; --line:#edebe9;
  --bg:#faf9f8; --blue:#0f6cbd; --green:#107c10; --orange:#c55a11; --red:#a4262c;
  --purple:#7719aa; --pale:#eef3fb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;font-size:14px}
a{color:inherit}
/* ---------- suite bar ---------- */
.suite{height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;
  padding:0 16px;gap:14px;position:sticky;top:0;z-index:40}
.suite .waffle{font-size:18px;opacity:.9}
.suite .brand{font-weight:600;font-size:15px}
.suite .search{flex:1;max-width:520px;background:rgba(255,255,255,.15);border-radius:4px;
  padding:6px 12px;color:#dfe8f7;font-size:13px}
.suite .me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px}
.suite .av{width:28px;height:28px;border-radius:50%;background:#5b8def;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:12px}
/* ---------- hub nav ---------- */
.hub{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:4px;padding:0 16px;height:44px;overflow-x:auto;position:sticky;top:48px;z-index:30}
.hub .hname{display:flex;align-items:center;gap:8px;font-weight:600;margin-right:14px;
  white-space:nowrap;cursor:pointer}
.hub .tile{width:22px;height:22px;border-radius:2px;background:var(--navy);color:#fff;
  font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.hub .hl{padding:0 12px;height:44px;display:flex;align-items:center;white-space:nowrap;
  cursor:pointer;font-size:13.5px;color:#323130;border-bottom:2px solid transparent}
.hub .hl:hover{background:#f3f2f1}
.hub .hl.on{border-bottom-color:var(--navy);font-weight:600;color:var(--navy)}
.hub .hl.new{color:var(--purple)}
.hub .hl.new::after{content:"NEW";font-size:9px;background:var(--purple);color:#fff;
  border-radius:8px;padding:1px 5px;margin-left:6px;font-weight:700}
.hub .memo{padding:0 12px;height:44px;display:flex;align-items:center;
  white-space:nowrap;cursor:pointer;font-size:13px;color:var(--gray);border-bottom:2px solid transparent}
.hub .memo:hover{background:#f3f2f1}
.hub .memo.on{border-bottom-color:var(--orange);color:var(--orange);font-weight:600}
/* ---------- layout ---------- */
.wrap{display:flex;gap:0;align-items:flex-start}
.side{width:252px;flex:none;background:#fff;border-right:1px solid var(--line);
  min-height:calc(100vh - 92px);padding:14px 0}
.side .sh{font-size:11px;color:var(--gray);padding:6px 18px;font-weight:600;letter-spacing:.04em}
.side .li{padding:7px 18px;cursor:pointer;font-size:13px;border-left:3px solid transparent;
  display:flex;align-items:center;gap:7px}
.side .li:hover{background:#f3f2f1}
.side .li.on{background:#eef3fb;border-left-color:var(--navy);font-weight:600;color:var(--navy)}
.side .li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .li .c{font-size:10.5px;color:#a19f9d;flex:none}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 14px}
.main{flex:1;min-width:0;padding:0 0 60px}
/* ---------- site header ---------- */
.shead{background:#fff;border-bottom:1px solid var(--line);padding:16px 26px 0}
.shead .r1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.shead .st{width:44px;height:44px;border-radius:4px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.shead h1{margin:0;font-size:19px}
.shead .sub{font-size:12px;color:var(--gray);display:flex;gap:14px;margin-top:3px;flex-wrap:wrap}
.shead .nav{display:flex;gap:22px;margin-top:14px;font-size:13px}
.shead .nav div{padding-bottom:9px;color:#484644;cursor:default}
.shead .nav div.on{border-bottom:2px solid var(--navy);font-weight:600;color:var(--navy)}
/* ---------- content ---------- */
.pad{padding:22px 26px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:18px;overflow:hidden}
.card>h2{margin:0;font-size:14px;padding:12px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .body{padding:14px 16px}
.badge{font-size:10.5px;font-weight:700;border-radius:10px;padding:2px 9px;color:#fff;white-space:nowrap}
.b-a{background:var(--blue)} .b-b{background:var(--green)} .b-c{background:var(--orange)}
.b-n{background:var(--purple)} .b-r{background:var(--red)}
/* library tiles（クイック リンク Web パーツ） */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.dbtn{border:1px solid #cfd8e6;background:#f7faff;border-radius:5px;padding:10px 12px;
  cursor:pointer;display:flex;align-items:center;gap:9px;font-size:13px;text-align:left}
.dbtn:hover{background:#eaf1fd;border-color:var(--navy)}
.dbtn .ic{width:28px;height:26px;border-radius:3px;background:var(--navy);color:#fff;
  font-size:9.5px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.dbtn .tx{flex:1;min-width:0}
.dbtn .tx b{display:block;font-weight:600}
.dbtn .tx span{font-size:11px;color:var(--gray)}
/* toolbar / table */
.tool{display:flex;align-items:center;gap:16px;padding:9px 16px;border-bottom:1px solid var(--line);
  font-size:13px;color:#323130;background:#fff;flex-wrap:wrap}
.tool .nw{color:var(--blue);font-weight:600}
.scroll{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.tb th{text-align:left;font-size:12px;color:var(--gray);font-weight:600;
  padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:8px 16px;border-bottom:1px solid #f5f4f3;vertical-align:top}
.tb tr:hover td{background:#f7f7f7}
.tb .grp td{background:#f3f7fd;font-weight:600;color:var(--navy);font-size:12.5px}
.tb .grp:hover td{background:#f3f7fd}
.fo::before{content:"📁";margin-right:8px}
.fi::before{content:"📄";margin-right:8px}
.lv{font-size:10.5px;border-radius:3px;padding:1px 7px;border:1px solid #d6d6d6;color:var(--gray);white-space:nowrap}
.col-chip{font-size:11px;background:#eef3fb;border:1px solid #cfd8e6;color:var(--navy);
  border-radius:3px;padding:1px 7px;white-space:nowrap}
.tagnew{font-size:10px;background:#f6ecfb;color:var(--purple);border-radius:3px;
  padding:1px 6px;margin-left:8px;font-weight:700;white-space:nowrap}
.tagchg{font-size:10px;background:#fdf2e9;color:var(--orange);border-radius:3px;
  padding:1px 6px;margin-left:8px;font-weight:700;white-space:nowrap}
.tagkeep{font-size:10px;background:#e8f5e9;color:var(--green);border-radius:3px;
  padding:1px 6px;margin-left:8px;font-weight:700;white-space:nowrap}
.tagdel{font-size:10px;background:#fdecea;color:var(--red);border-radius:3px;
  padding:1px 6px;margin-left:8px;font-weight:700;white-space:nowrap}
/* toggle */
.tg{display:inline-flex;border:1px solid #cfd8e6;border-radius:16px;overflow:hidden;font-size:12px}
.tg div{padding:5px 15px;cursor:pointer;background:#fff;color:var(--gray)}
.tg div.on{background:var(--navy);color:#fff;font-weight:700}
.note{background:#fffbe9;border-left:4px solid #e8b93a;padding:10px 14px;font-size:12.5px;
  line-height:1.65;border-radius:0 4px 4px 0;margin-top:12px}
.note.g{background:#eef8ee;border-left-color:var(--green)}
.note.o{background:#fdf4ec;border-left-color:var(--orange)}
.note.p{background:#f8f2fc;border-left-color:var(--purple)}
.note.r{background:#fdecea;border-left-color:var(--red)}
.foot{padding:16px 26px;color:#8a8886;font-size:11.5px;border-top:1px solid var(--line);
  background:#fff;line-height:1.8}
.search-box{border:1px solid #cfd8e6;border-radius:4px;padding:5px 10px;font:inherit;font-size:12.5px;min-width:200px}
@media(max-width:900px){.side{display:none}}
@media(max-width:1100px){.grid2{grid-template-columns:1fr !important}}
@media print{
  .suite,.hub,.side,.shead .nav{display:none !important}
  .wrap{display:block}.main{padding:0}.pad{padding:8px}
  body{background:#fff;font-size:9.5px}
  .card{break-inside:avoid;margin-bottom:7px}
  .card>h2{padding:7px 10px;font-size:11px}
  .card .body{padding:8px 10px !important}
  .grid2{grid-template-columns:1fr 1fr !important;gap:7px !important}
  ul{font-size:9.5px !important;line-height:1.5 !important}
}
</style>
</head>

function viewLib(){
  const l=libsOf(ST.site).find(x=>x.code===ST.lib);
  if(!l) return viewHome();
  let subs=subsOf(l.code);
  if(ST.q) subs=subs.filter(x=>(x.name||"").includes(ST.q));

  const rows=subs.map((x,i)=>({
    name: x.name ? `${x.name}_2026年度.${EXT[i%EXT.length]}` : "（小分類名が rev10 で未記入です）",
    type: x.name || "—",
    dept: (x.depts&&x.depts.length) ? x.depts.join("・") : "—",
    keep: x.keep || "—",
    date: DATES[i%DATES.length],
  }));

  const fols = (D.fold[l.code]||[]).filter(n=>!ST.q||n.includes(ST.q));
  const fils = (D.file[l.code]||[]).filter(n=>!ST.q||n.includes(ST.q));
  const folRows = fols.map((n,i)=>`<tr><td class="fo"><b>${esc(n)}</b></td>
      <td><span class="lv">フォルダ</span></td><td>—</td><td>—</td>
      <td style="color:var(--gray)">${esc(DATES[i%DATES.length])}</td></tr>`).join("");
  const filRows = fils.map((n,i)=>`<tr><td class="fi">${esc(n)}</td>
      <td><span class="lv">未設定</span></td><td>—</td><td>—</td>
      <td style="color:var(--gray)">${esc(DATES[(i+2)%DATES.length])}</td></tr>`).join("");

  let body;
  if(ST.view==="grp"){
    const g={}; rows.forEach(r=>{ (g[r.type]=g[r.type]||[]).push(r); });
    body=Object.keys(g).map(k=>
      `<tr class="grp"><td colspan="5">▾ 文書種別：${esc(k)}（${g[k].length}）</td></tr>`+
      g[k].map(r=>`<tr><td class="fi">${esc(r.name)}</td><td></td><td>${esc(r.dept)}</td>
        <td>${esc(r.keep)}</td><td style="color:var(--gray)">${esc(r.date)}</td></tr>`).join("")
    ).join("");
  }else{
    body=rows.map(r=>`<tr><td class="fi">${esc(r.name)}</td>
      <td><span class="col-chip">${esc(r.type)}</span></td>
      <td>${esc(r.dept)}</td><td>${esc(r.keep)}</td>
      <td style="color:var(--gray)">${esc(r.date)}</td></tr>`).join("");
  }
  if(ST.view==="list"){
    const head = (folRows||filRows)
      ? `<tr class="grp"><td colspan="5">現行（v3.5）の第1階層フォルダ ${fols.length} 件${fils.length?"・ファイル "+fils.length+" 件":""}　― 移管したときに、ここに入ってきます</td></tr>`
      : "";
    const head2 = rows.length
      ? `<tr class="grp"><td colspan="5">rev10 の文書種別 ${rows.length} 種　― 列の値としてどう見えるかの見本です</td></tr>` : "";
    body = head + folRows + filRows + head2 + body;
  }
  if(!folRows && !filRows && !rows.length) body=`<tr><td colspan="5" style="padding:30px;text-align:center;color:#a19f9d">該当するものがありません。</td></tr>`;

  const all=subsOf(l.code);
  const blank=all.filter(x=>!x.name).length;

      ${ noDept ? `<div class="note"><b>担当部署は rev10 側の記入がありません。</b>
             公開範囲は、これまでどおり主管部署の設定で決める必要があります。確認事項 No.15 に挙げています。</div>` : "" }

/* ---------------------------------------------------------- draw */
function draw(){
  drawHub(); drawSide(); drawHead();
  let h="";
  if(ST.memo==="sum") h=viewSum();
  else if(ST.memo==="map") h=viewMap();
  else if(ST.memo==="undec") h=viewUndec();
  else if(ST.memo==="eig") h=viewEig();
  else if(ST.memo==="ask") h=viewAsk();
  else if(ST.lib) h=viewLib();
  else { h=viewHome(); if(ST.site==="portal") h+=viewCols(); }
  $("#pad").innerHTML=h;

  document.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>{
    ST={site:e.dataset.go,lib:null,view:"list",memo:null,q:""};draw();});
  document.querySelectorAll("[data-memo]").forEach(e=>e.onclick=()=>{
    ST.memo=e.dataset.memo;ST.lib=null;ST.q="";draw();});
  document.querySelectorAll("[data-lib]").forEach(e=>e.onclick=()=>{
    ST.lib=e.dataset.lib||null;ST.view="list";ST.q="";draw();});
  document.querySelectorAll("[data-view]").forEach(e=>e.onclick=()=>{
    ST.view=e.dataset.view;draw();});

  const q=$("#q");
  if(q) q.oninput=()=>{ ST.q=q.value.trim(); draw();
    const n=$("#q"); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);} };

  $("#foot").innerHTML =
    `これは設計をご確認いただくための試作画面です。実在のファイルは配置していません。<br>`+
    `<b>各部門レビュー（71件）を反映する前の構造に、共通文書管理体系 rev10（小分類マスタ）だけを反映した版です。</b>`+
    `v3.8 で反映したレビュー内容（第1階層ルール・主管部署・PJサイト・入力層サイト）は入っていません。<br>`+
    `サイト ${D.stats.sites} ／ ドキュメント ライブラリ ${D.stats.libs} ／ 文書種別 ${D.stats.sub}。`+
    `データは設計書 v4.0 と rev10 小分類マスタから機械的に生成しています。`;
}

draw();
</script>
